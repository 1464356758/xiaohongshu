ily="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#766A62" text-anchor="start" letter-spacing="0" opacity="1">示意配色，仅作妆感灵感参考。</text><line x1="92" y1="1320" x2="988" y2="1320" stroke="#D9CBC0" stroke-width="2"/>
